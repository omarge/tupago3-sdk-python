name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff format check
        run: ruff format --check src tests examples
      - name: Ruff lint
        run: ruff check src tests examples
      - name: Mypy
        run: mypy src
      - name: Tests with coverage
        run: pytest --cov=tupago3_sdk --cov-report=term-missing -q
      - name: Build
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
      - name: Dependency audit
        run: pip-audit -r <(pip freeze) || true
      - name: Secret scan (no secrets committed)
        run: |
          grep -rniE "secret\s*=\s*[\"'][A-Za-z0-9+/=]{32,}|base64-secret" src tests examples || echo "no secrets found"
